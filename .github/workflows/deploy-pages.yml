name: Deploy book to GitHub Pages

# Builds the static site from content/ with site/generate.py and publishes it to the
# gh-pages branch, which GitHub Pages serves (legacy branch source) at the custom
# domain aw.isainative.dev. The committed images (cover, og-image, icons) ship as-is.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/**"
      - "examples/**"
      - "assets/**"
      - "scripts/**"
      - "analytics/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/validate-book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-book.yml
    with:
      artifact-name: validated-pages

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated site, analytics beacon, and PDF
        uses: actions/download-artifact@v4
        with:
          name: validated-pages
          path: artifact

      - name: Publish the exact validated site to gh-pages
        run: |
          cd artifact/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${SOURCE_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
